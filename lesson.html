<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuildBright Lesson</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <script src="algebra1-lessons.js" defer></script>
    <script src="geometry-lessons.js" defer></script>
    <script src="algebra2-lessons.js" defer></script>
    <script src="calculus1-lessons.js" defer></script>
    <script src="calculus2-lessons.js" defer></script>
    <script src="calculus3-lessons.js" defer></script>
    <script src="calculus4-lessons.js" defer></script>
    <script src="script.js" defer></script>
</head>

<body class="lesson-page">

    <div class="progress-tracker">
        Progress: <span id="global-progress">0%</span>
    </div>

    <div class="math-lesson-page-heading">

        <a href="courses.html" class="math-lesson-back">
            ← Mathematics Courses
        </a>

        <span class="math-lesson-eyebrow">
            BUILDBRIGHT MATHEMATICS
        </span>

        <h2>Learn it. Practice it. Master it.</h2>

        <p>
            Explore the lesson, work through the examples,
            and test your understanding.
        </p>

    </div>

    <section class="lesson-content-card">

        <h1 id="lesson-title">Lesson Title</h1>
        <p id="lesson-subtitle">Learn with clarity.</p>

        <div id="lesson-body"></div>

        <button id="start-quiz-btn" onclick="startQuiz()">
            Next: Start Questions
        </button>

    </section>

    <section id="quiz-section" class="quiz-card" style="display: none;">

        <h2>Practice Questions</h2>
        <p>20 questions: 5 easy, 5 medium, 10 hard.</p>

        <div id="quiz"></div>

        <button id="submit-btn" onclick="checkTemplateQuiz()">
            Submit Answers
        </button>


        <button id="retry-btn" onclick="location.reload()" style="display: none;">
            Retry Quiz
        </button>
        <button id="next-topic-btn" onclick="goToNextTopic()" style="display: none;">
            Next Topic
        </button>

        <h2 id="score"></h2>
        <pre id="feedback"></pre>

    </section>

    </main>

</body>

</html>
